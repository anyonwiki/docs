# Rebuild the website whenever the documentation changes.
#
# The frontend compiles these MDX files at build time (its `prebuild` step
# clones this repository), so a fresh deployment is the only way for an edit
# here to reach the live site. This asks Railway to rebuild and redeploy the
# frontend service.
#
# Requirements (repo Settings -> Secrets and variables -> Actions):
#   RAILWAY_TOKEN           - a Railway *project token* for the production
#                             environment (Railway: Project -> Settings -> Tokens).
#   RAILWAY_ENVIRONMENT_ID  - from the service URL: ...?environmentId=<this>
#   RAILWAY_SERVICE_ID      - from the service URL: /service/<this>
#
# `serviceInstanceRedeploy` rebuilds from the service's current commit and is
# permitted for project tokens. `environmentTriggersDeploy` is not (it returns
# "Bad Access"), and a restart would not rebuild at all.

name: Redeploy frontend

on:
  push:
    branches: [master]
    paths:
      - "content/**"
  workflow_dispatch:

concurrency:
  group: redeploy-frontend
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and redeploy the frontend on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          for v in RAILWAY_TOKEN ENVIRONMENT_ID SERVICE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done

          payload=$(jq -n \
            --arg e "$ENVIRONMENT_ID" --arg s "$SERVICE_ID" \
            '{
              query: "mutation Redeploy($e: String!, $s: String!) { serviceInstanceRedeploy(environmentId: $e, serviceId: $s) }",
              variables: { e: $e, s: $s }
            }')

          response=$(curl -sS https://backboard.railway.com/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -d "$payload")

          echo "$response"
          if echo "$response" | jq -e '.errors' > /dev/null; then
            echo "::error::Railway rejected the deploy request"
            exit 1
          fi
          echo "Frontend rebuild triggered."
